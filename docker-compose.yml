services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: writers_circle
      POSTGRES_USER: writers_circle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build:
      context: .
      target: migration
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: postgresql://writers_circle:${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env.docker}@postgres:5432/writers_circle
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file:
      - .env.docker
    environment:
      DATABASE_URI: postgresql://writers_circle:${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env.docker}@postgres:5432/writers_circle
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PAYLOAD_MEDIA_DIR: /app/media
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - media_data:/app/media

volumes:
  media_data:
  postgres_data:
